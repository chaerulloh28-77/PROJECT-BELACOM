  <head>
    <script>
      (function() {
        // Prevent Vite development HMR socket attempts to port 24678
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.indexOf('24678') !== -1 || url.indexOf('localhost:24678') !== -1 || url.indexOf('token=') !== -1)) {
              return {
                readyState: 3,
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && a.message) || String(a);
          }).join(' ');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('HMR') !== -1 || msg.indexOf('ERR_CONNECTION_REFUSED') !== -1) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason && (event.reason.message || event.reason.toString());
          if (reason && (reason.includes('WebSocket') || reason.includes('websocket') || reason.includes('HMR') || reason.includes('ERR_CONNECTION_REFUSED'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('websocket') || event.message.includes('ERR_CONNECTION_REFUSED'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
